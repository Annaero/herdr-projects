[package]
name = "herdr-superwork"
version = "0.3.0"
edition = "2024"
description = "A work board for herdr: one list of tasks, each delegated one running as an ordinary herdr agent."
license = "MIT"
publish = false
# The tests are one program (tests/main.rs, every file in tests/ a module of it), not one program per file.
autotests = false

[lib]
name = "sw"
path = "src/lib.rs"

[[bin]]
name = "herdr-superwork"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number read back from a saved file is the number written (a closing note's time is compared exactly).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unicode-width = "0.2"
unicode-segmentation = "1"
libc = "0.2"
regex = "1"
fancy-regex = "0.14"
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha1_smol = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# What the check builds and tests with (scripts/check.sh): quick to build again after a small change. The release
# build above is for the files people install.
[profile.quick]
inherits = "dev"
opt-level = 1
debug = false
